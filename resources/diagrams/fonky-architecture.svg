<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0d1729"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f4c75"/>
      <stop offset="1" stop-color="#136f9f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000814" flood-opacity=".5"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#4cc9f0"/>
    </marker>
    <style>
      .title{font:700 46px 'DejaVu Sans',Arial,sans-serif;fill:#f7fbff;letter-spacing:2px}
      .subtitle{font:400 21px 'DejaVu Sans',Arial,sans-serif;fill:#93a9c4}
      .layer{font:700 18px 'DejaVu Sans',Arial,sans-serif;fill:#4cc9f0;letter-spacing:2px}
      .card-title{font:700 22px 'DejaVu Sans',Arial,sans-serif;fill:#f7fbff}
      .card-sub{font:400 16px 'DejaVu Sans',Arial,sans-serif;fill:#a8bad0}
      .core-title{font:700 27px 'DejaVu Sans',Arial,sans-serif;fill:#ffffff}
      .core-sub{font:400 17px 'DejaVu Sans',Arial,sans-serif;fill:#cbeeff}
      .small{font:600 16px 'DejaVu Sans',Arial,sans-serif;fill:#d9e7f5}
      .footer{font:400 16px 'DejaVu Sans',Arial,sans-serif;fill:#7087a3}
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="155" cy="106" r="70" fill="#0096c7" opacity=".08"/>
  <circle cx="1760" cy="875" r="170" fill="#4cc9f0" opacity=".045"/>
  <text x="90" y="86" class="title">FONKY • PROVIDER-NATIVE AI TOOLING</text>
  <text x="92" y="124" class="subtitle">One canonical implementation layer · Six native provider contracts · 150 shared operations</text>

  <text x="92" y="184" class="layer">APPLICATION LAYER</text>
  <rect x="90" y="204" width="1740" height="92" rx="18" fill="#111f34" stroke="#263b56" stroke-width="2" filter="url(#shadow)"/>
  <text x="960" y="243" text-anchor="middle" class="card-title">Applications · Notebooks · Automation Pipelines · AI Agents</text>
  <text x="960" y="273" text-anchor="middle" class="card-sub">Consumers select only the provider-native Fonky tools required by their workflow</text>

  <path d="M960 296 V342" stroke="#4cc9f0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="92" y="358" class="layer">PROVIDER ADAPTER LAYER</text>

  <g filter="url(#shadow)">
    <rect x="90" y="382" width="270" height="132" rx="16" fill="#122235" stroke="#10a37f" stroke-width="3"/>
    <rect x="386" y="382" width="270" height="132" rx="16" fill="#122235" stroke="#d97757" stroke-width="3"/>
    <rect x="682" y="382" width="270" height="132" rx="16" fill="#122235" stroke="#4285f4" stroke-width="3"/>
    <rect x="978" y="382" width="270" height="132" rx="16" fill="#122235" stroke="#dce6f2" stroke-width="3"/>
    <rect x="1274" y="382" width="270" height="132" rx="16" fill="#122235" stroke="#ff7b45" stroke-width="3"/>
    <rect x="1570" y="382" width="260" height="132" rx="16" fill="#122235" stroke="#22c7a9" stroke-width="3"/>
  </g>
  <text x="225" y="423" text-anchor="middle" class="card-title">OpenAI Agents</text>
  <text x="225" y="454" text-anchor="middle" class="card-sub">fonky.gpt.tools</text>
  <text x="225" y="483" text-anchor="middle" class="small">@function_tool</text>
  <text x="521" y="423" text-anchor="middle" class="card-title">Anthropic Claude</text>
  <text x="521" y="454" text-anchor="middle" class="card-sub">fonky.claude.tools</text>
  <text x="521" y="483" text-anchor="middle" class="small">@beta_tool</text>
  <text x="817" y="423" text-anchor="middle" class="card-title">Google ADK</text>
  <text x="817" y="454" text-anchor="middle" class="card-sub">fonky.gemini.tools</text>
  <text x="817" y="483" text-anchor="middle" class="small">Plain callables</text>
  <text x="1113" y="423" text-anchor="middle" class="card-title">xAI Grok</text>
  <text x="1113" y="454" text-anchor="middle" class="card-sub">fonky.grok.tools</text>
  <text x="1113" y="483" text-anchor="middle" class="small">Callable + schema</text>
  <text x="1409" y="423" text-anchor="middle" class="card-title">Mistral AI</text>
  <text x="1409" y="454" text-anchor="middle" class="card-sub">fonky.mistral.tools</text>
  <text x="1409" y="483" text-anchor="middle" class="small">Callable + JSON schema</text>
  <text x="1700" y="423" text-anchor="middle" class="card-title">LangChain</text>
  <text x="1700" y="454" text-anchor="middle" class="card-sub">fonky.langchain.tools</text>
  <text x="1700" y="483" text-anchor="middle" class="small">@tool</text>

  <path d="M225 514 V572 M521 514 V572 M817 514 V572 M1113 514 V572 M1409 514 V572 M1700 514 V572" stroke="#4cc9f0" stroke-width="2.5"/>
  <path d="M225 572 H1700 M960 572 V612" stroke="#4cc9f0" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="92" y="624" class="layer">CANONICAL FONKY LAYER</text>
  <rect x="90" y="646" width="1740" height="192" rx="22" fill="url(#core)" stroke="#62d4ff" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="960" y="689" text-anchor="middle" class="core-title">Shared implementations — provider logic is never duplicated</text>
  <rect x="130" y="720" width="370" height="82" rx="14" fill="#092f4a" stroke="#57c7ee"/>
  <rect x="530" y="720" width="370" height="82" rx="14" fill="#092f4a" stroke="#57c7ee"/>
  <rect x="930" y="720" width="370" height="82" rx="14" fill="#092f4a" stroke="#57c7ee"/>
  <rect x="1330" y="720" width="460" height="82" rx="14" fill="#092f4a" stroke="#57c7ee"/>
  <text x="315" y="754" text-anchor="middle" class="card-title">fetchers.py</text>
  <text x="315" y="781" text-anchor="middle" class="core-sub">APIs · search · public data</text>
  <text x="715" y="754" text-anchor="middle" class="card-title">loaders.py</text>
  <text x="715" y="781" text-anchor="middle" class="core-sub">files · cloud · documents</text>
  <text x="1115" y="754" text-anchor="middle" class="card-title">scrapers.py</text>
  <text x="1115" y="781" text-anchor="middle" class="core-sub">web extraction · crawling</text>
  <text x="1560" y="754" text-anchor="middle" class="card-title">processors.py</text>
  <text x="1560" y="781" text-anchor="middle" class="core-sub">NLP · chunking · semantic search</text>

  <path d="M960 838 V886" stroke="#4cc9f0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="92" y="902" class="layer">SHARED SERVICES &amp; DATA SOURCES</text>
  <rect x="90" y="922" width="520" height="94" rx="17" fill="#111f34" stroke="#263b56" stroke-width="2"/>
  <rect x="635" y="922" width="520" height="94" rx="17" fill="#111f34" stroke="#263b56" stroke-width="2"/>
  <rect x="1180" y="922" width="650" height="94" rx="17" fill="#111f34" stroke="#263b56" stroke-width="2"/>
  <text x="350" y="960" text-anchor="middle" class="card-title">models.py · config.py · boogr.py</text>
  <text x="350" y="988" text-anchor="middle" class="card-sub">models · credentials · error handling</text>
  <text x="895" y="960" text-anchor="middle" class="card-title">Local &amp; Cloud Content</text>
  <text x="895" y="988" text-anchor="middle" class="card-sub">documents · storage · mail · notebooks</text>
  <text x="1505" y="960" text-anchor="middle" class="card-title">External Services</text>
  <text x="1505" y="988" text-anchor="middle" class="card-sub">public APIs · web · geospatial · environment · science</text>
  <text x="1830" y="1050" text-anchor="end" class="footer">Fonky architecture · provider-native adapters over canonical Python implementations</text>
</svg>
