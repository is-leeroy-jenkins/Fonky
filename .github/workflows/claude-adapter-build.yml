name: Build Claude Adapter

on:
  push:
    paths:
      - '.github/workflows/claude-adapter-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Claude peer adapter
        shell: python
        run: |
          from pathlib import Path

          source_path = Path( 'gpt/tools.py' )
          target_path = Path( 'claude/tools.py' )
          source = source_path.read_text( encoding='utf-8' )

          replacements = {
              'Created:                 08-23-2026': 'Created:                 09-02-2026',
              'Last Modified On:        09-01-2026': 'Last Modified On:        09-02-2026',
              'Provides the OpenAI Agents SDK function-tool interface for Fonky.': 'Provides the Anthropic Claude function-tool interface for Fonky.',
              'Exposes individual OpenAI Agents SDK function tools over implementation classes in': 'Exposes individual Anthropic Claude function tools over implementation classes in',
              'operation is decorated with ``@function_tool`` so the OpenAI Agents SDK can derive its': 'operation is decorated with ``@beta_tool`` so the Anthropic SDK can derive its',
              'implementation, and return the result through the agent runtime.': 'implementation, and expose the result through Claude client-tool execution.',
              'from agents import function_tool': 'from anthropic import beta_tool',
              '@function_tool': '@beta_tool',
              "Google ADK Agent through its ``tools`` collection": 'Anthropic Claude client-tool workflow',
          }

          target = source
          for old, new in replacements.items( ):
              target = target.replace( old, new )

          target_path.write_text( target, encoding='utf-8' )

      - name: Validate generated module
        shell: python
        run: |
          from pathlib import Path
          import ast

          path = Path( 'claude/tools.py' )
          source = path.read_text( encoding='utf-8' )
          tree = ast.parse( source )

          assert 'from ..gpt' not in source
          assert 'FunctionTool' not in source
          assert '@function_tool' not in source
          assert '_create_claude_tool' not in source
          assert '_register_tools' not in source
          assert 'from anthropic import beta_tool' in source

          public_functions = [
              node.name
              for node in tree.body
              if isinstance( node, ast.FunctionDef ) and not node.name.startswith( '_' )
          ]
          decorated_functions = [
              node.name
              for node in tree.body
              if isinstance( node, ast.FunctionDef )
              and any( isinstance( decorator, ast.Name ) and decorator.id == 'beta_tool'
                       for decorator in node.decorator_list )
          ]

          assert public_functions == decorated_functions
          assert len( public_functions ) > 0

      - name: Commit Claude adapter
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude/tools.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Implement direct Anthropic Claude tool adapter"
          git push
