site_name: Fonky
site_description: Python framework for data retrieval, document ingestion, web scraping, cloud access, and domain-oriented public-data workflows.
site_url: https://is-leeroy-jenkins.github.io/Fonky/
repo_name: is-leeroy-jenkins/Fonky
repo_url: https://github.com/is-leeroy-jenkins/Fonky
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: en
  favicon: images/favicon.ico
  logo: images/fonky-logo.png
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - search.share
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Usage: usage.md
  - User Guide: user-guide.md
  - API Reference:
      - Functional API: api/fonky.md
      - Fetchers: api/fetchers.md
      - Loaders: api/loaders.md
      - Scrapers: api/scrapers.md
      - Models: api/models.md
      - Processors: api/processors.md
      - Core: api/core.md
      - Boogr Integration: api/boogr.md
plugins:
  - search
extra_css:
  - stylesheets/fonky.css
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/is-leeroy-jenkins/Fonky
      name: Fonky on GitHub
