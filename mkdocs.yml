site_name: Fonky
site_description: Data retrieval, document ingestion, scraping, cloud, public data, and scientific provider framework.
site_url: https://is-leeroy-jenkins.github.io/Fonky/
repo_name: is-leeroy-jenkins/Fonky
repo_url: https://github.com/is-leeroy-jenkins/Fonky
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: blue
      accent: light blue
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - User Guide:
      - Overview: user-guide.md
      - Archives: guides/archives.md
      - Astronomical: guides/astronomical.md
      - Cloud: guides/cloud.md
      - Demographic: guides/demographic.md
      - Documents: guides/documents.md
      - Environmental: guides/environmental.md
      - Geospatial: guides/geospatial.md
      - Health: guides/health.md
      - Web: guides/web.md
      - Results and Data Shapes: guides/results.md
      - Stateful vs Functional Usage: guides/state.md
      - Dependencies and Credentials: guides/dependencies.md
      - Failure Handling: guides/failures.md
  - Troubleshooting: troubleshooting.md
  - API Reference:
      - Functional API: api/fonky.md
      - Fetchers: api/fetchers.md
      - Loaders: api/loaders.md
      - Scrapers: api/scrapers.md
      - Models: api/models.md
      - Processors: api/processors.md
      - Core: api/core.md
      - Config: api/config.md
  - Development:
      - Overview: development/index.md
      - Adding a Fetcher: development/adding-fetcher.md
      - Adding a Loader: development/adding-loader.md
      - Adding a Scraper: development/adding-scraper.md
      - Adding a Wrapper: development/adding-wrapper.md
      - Testing and Validation: development/testing.md
plugins:
  - search
extra_css:
  - stylesheets/fonky.css
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
