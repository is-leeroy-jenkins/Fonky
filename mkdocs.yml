site_name: Fonky
site_description: Data retrieval, document ingestion, web scraping, cloud access, public data, scientific and geospatial integration framework.
site_url: https://is-leeroy-jenkins.github.io/Fonky/
repo_name: is-leeroy-jenkins/Fonky
repo_url: https://github.com/is-leeroy-jenkins/Fonky

docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  favicon: images/favicon.ico
  logo: images/fonky-logo.png
  language: en
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: slate
      primary: blue
      accent: light blue

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - User Guide:
      - Overview: user-guide.md
      - Guide Index: user-guide/index.md
      - Archives & Research: guides/archives.md
      - Astronomy & Space: guides/astronomical.md
      - Cloud & Remote Storage: guides/cloud.md
      - Demographic & Public Data: guides/demographic.md
      - Document Loading: guides/documents.md
      - Environmental & Climate: guides/environmental.md
      - Geospatial & Mapping: guides/geospatial.md
      - Health Data: guides/health.md
      - Web Retrieval & Scraping: guides/web.md
      - Functional vs Class Usage: guides/interface-selection.md
      - Usage Patterns: guides/usage.md
      - Combining Capabilities: guides/composing-workflows.md
      - State Management: guides/state.md
      - Failure Handling: guides/failures.md
      - Results & Return Shapes: guides/results.md
      - Credentials & Dependencies: guides/dependencies.md
      - Troubleshooting Guide: guides/troubleshooting.md
  - Troubleshooting: troubleshooting.md
  - API Reference:
      - Functional API: api/fonky.md
      - LangChain Tools: api/tools.md
      - Fetchers: api/fetchers.md
      - Loaders: api/loaders.md
      - Scrapers: api/scrapers.md
      - Models: api/models.md
      - Processors: api/processors.md
      - Core: api/core.md
      - Configuration API: api/config.md
      - Boogr: api/boogr.md
  - Development:
      - Overview: development/index.md
      - Development Guide: development/development-guide.md
      - Adding a Fetcher: development/adding-fetcher.md
      - Adding a Loader: development/adding-loader.md
      - Adding a Scraper: development/adding-scraper.md
      - Adding a Wrapper: development/adding-wrapper.md
      - Testing & Documentation: development/testing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - .
          options:
            docstring_style: google
            docstring_section_style: table
            filters: public
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            show_root_heading: false
            show_root_full_path: false
            show_root_members_full_path: false
            show_object_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            show_bases: true
            show_inheritance_diagram: true
            show_if_no_docstring: false
            show_docstring_description: true
            show_docstring_attributes: true
            show_docstring_functions: true
            show_docstring_classes: true
            show_docstring_parameters: true
            show_docstring_other_parameters: true
            show_docstring_returns: true
            show_docstring_raises: true
            show_docstring_warns: true
            show_docstring_yields: true
            show_docstring_receives: true
            show_docstring_examples: true

extra_css:
  - stylesheets/fonky.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
